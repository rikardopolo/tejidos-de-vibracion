name: Book quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: book-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content lint
        run: pnpm lint:contenido:estricto
      - name: Tests
        run: pnpm test
      # El guard corre su propio self-test antes de comprobar nada, asi que este
      # paso tambien vigila al vigilante.
      - name: Guard del ledger Supabase
        run: pnpm check:supabase-ledger
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
