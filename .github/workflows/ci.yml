name: Book quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: book-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Content lint
        run: pnpm lint:contenido
      - name: Tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      # ponytail: falta a proposito el `Guard del ledger Supabase`. El borrador de
      # este workflow lo traia, pero ni `pnpm check:supabase-ledger` ni
      # scripts/check-supabase-ledger.mjs estan en main —viven como cambio local
      # sin commitear—, asi que ese paso saldria rojo en cada PR desde el dia uno.
      # Anadirlo cuando el script aterrice, en el mismo PR que lo traiga.
